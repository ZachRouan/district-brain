# Development database: PostgreSQL with the pgvector extension.
# Host port 54320 avoids colliding with any Postgres already on 5432.
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: districtbrain
      POSTGRES_USER: districtbrain
      POSTGRES_PASSWORD: districtbrain  # dev only — set a real password in production (see docs/runbook.md)
    ports:
      - "54320:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U districtbrain"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
