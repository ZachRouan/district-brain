[project]
name = "district-brain"
version = "0.1.0"
description = "Locally hosted, role-scoped RAG over a K-12 school district's knowledge corpus, with chunk-level citations and a full audit trail."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "django>=5.2,<6.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.3",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "django-allauth[socialaccount]>=65.0",
    "requests>=2.32",
    # torch is only needed by sentence-transformers, but it is listed here so
    # the CPU-wheel index source below applies (uv honours sources for direct
    # dependencies only). Without it the CUDA build is pulled from PyPI.
    "torch>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.16.4",
]

# Embeddings run fine on CPU; the CPU wheel keeps installs ~2 GB smaller than CUDA.
# A GPU is only relevant for the (separate) LLM serving layer, not this app.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "districtbrain.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 110
target-version = "py312"  # the oldest interpreter requires-python allows
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "RUF"]
ignore = [
    "RUF012",  # Django Meta/class attrs are conventionally plain lists/dicts
]

[tool.ruff.lint.isort]
known-first-party = ["accounts", "audit", "chat", "corpus", "districtbrain"]
